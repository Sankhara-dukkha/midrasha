# Local development only. Credentials here are throwaway dev defaults, never used in deployment.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: midrasha
      POSTGRES_PASSWORD: midrasha
      POSTGRES_DB: midrasha
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U midrasha"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
